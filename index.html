<script type="module">

import app from "./js/app.js";

import theme from "./js/theme.js";

import router from "./js/router.js";

import ui from "./js/ui.js";

window.app = app;

window.theme = theme;

window.router = router;

window.ui = ui;

ui.registerView(

    "dashboard",

    "#dashboard"

);

ui.registerView(

    "production",

    "#production"

);

ui.registerView(

    "quality",

    "#quality"

);

ui.registerView(

    "reports",

    "#reports"

);

ui.registerView(

    "users",

    "#users"

);

ui.registerView(

    "settings",

    "#settings"

);

</script>
<script type="module">

import analytics from "./js/analytics.js";
import charts from "./js/charts.js";
import events from "./js/events.js";
import notifications from "./js/notifications.js";

window.analytics = analytics;
window.charts = charts;
window.events = events;
window.notifications = notifications;

events.on("dashboard:refresh", () => {

    const data = analytics.dashboard();

    console.log(data);

});

</script>
<script type="module">

import auth from "./js/auth.js";
import backup from "./js/backup.js";
import exporter from "./js/export.js";
import permissions from "./js/permissions.js";

window.auth = auth;
window.backup = backup;
window.exporter = exporter;
window.permissions = permissions;

window.exportJSON = () => exporter.json();

window.exportCSV = () => exporter.csv();

window.createBackup = () => backup.download();

window.logout = () => auth.logout();

</script>
<script type="module">

import sync from "./js/sync.js";
import logger from "./js/logger.js";
import storage from "./js/storage.js";
import validator from "./js/validation.js";

window.sync = sync;
window.logger = logger;
window.storage = storage;
window.validator = validator;

window.addEventListener("online", () => {

    logger.success("Online");

});

window.addEventListener("offline", () => {

    logger.warning("Offline");

});

</script>
<script type="module">

import "./js/app.js";
