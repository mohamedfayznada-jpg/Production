name: Security Scan

on:

  push:

    branches:
      - main

  pull_request:

    branches:
      - main

  schedule:

    - cron: "0 2 * * 1"

jobs:

  security:

    runs-on: ubuntu-latest

    permissions:

      contents: read

      security-events: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
         node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: npm Audit
        run: npm audit || true

      - name: Run ESLint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
