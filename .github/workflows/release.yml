name: Release

on:

  push:

    tags:

      - "v*"

  workflow_dispatch:

jobs:

  release:

    runs-on: ubuntu-latest

    permissions:

      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Archive Build
        run: |
          cd dist
          zip -r ../MES_CORE_V27.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: MES_CORE_V27.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
