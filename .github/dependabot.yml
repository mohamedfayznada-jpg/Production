version: 2

updates:

  - package-ecosystem: "npm"

    directory: "/"

    schedule:
      interval: "weekly"

    open-pull-requests-limit: 10

    labels:
      - dependencies
      - npm

    commit-message:
      prefix: "deps"

    reviewers:
      - mes-core-admin

    assignees:
      - mes-core-admin

    versioning-strategy: increase

  - package-ecosystem: "github-actions"

    directory: "/"

    schedule:
      interval: "weekly"

    open-pull-requests-limit: 5

    labels:
      - github-actions

    commit-message:
      prefix: "ci"

    reviewers:
      - mes-core-admin

    assignees:
      - mes-core-admin
